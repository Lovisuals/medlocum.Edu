services:
  api:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://lms:password@db:5432/medlocum_lms
      REDIS_URL: redis://cache:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      OFFICE365_CLIENT_ID: ${OFFICE365_CLIENT_ID}
      OFFICE365_TENANT_ID: ${OFFICE365_TENANT_ID}
      NEXT_PUBLIC_PLATFORM_NAME: MedLocum Academy
      NEXT_PUBLIC_PLATFORM_URL: https://academy.medlocumjobs.com
      NEXT_PUBLIC_SUPPORT_EMAIL: academy@medlocumjobs.com
      NEXT_PUBLIC_PRIMARY_COLOR: "#2362EB"
      NEXT_PUBLIC_ACCENT_COLOR: "#34D399"
      NEXT_PUBLIC_TENANT_ID: medlocumjobs
    volumes:
      - .:/app
    command: npm run dev
    depends_on:
      - db
      - cache

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: password
      POSTGRES_DB: medlocum_lms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  worker:
    image: node:20-alpine
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://lms:password@db:5432/medlocum_lms
      REDIS_URL: redis://cache:6379
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    volumes:
      - .:/app
    command: node dist/worker.js
    depends_on:
      - db
      - cache

volumes:
  postgres_data:
